<title>OK Mobility Car Rentals & Hire</title>
<meta name="description" content="OK Mobility Car Rentals & Hire — book and manage car rentals in Kenya.">

<style>
:root{
  --ink:#0F1B2D; --ink-2:#16263D; --surface:#1B2E48; --surface-2:#213655;
  --line:#2A3F5C; --line-soft:#22364f;
  --amber:#F5B301; --amber-d:#d99e00;
  --teal:#17C3B2; --green:#22C55E; --red:#EF4444; --red-d:#c53a3a;
  --text:#F4F6F9; --muted:#93A4BB; --muted-2:#6f829c;
  --plate:#F5B301;
  --radius:14px; --radius-sm:10px;
  --shadow:0 10px 30px rgba(0,0,0,.35);
  --maxw:1160px;
  --disp:"Barlow Semi Condensed", system-ui, "Segoe UI", sans-serif;
  --body:"Inter", system-ui, "Segoe UI", Roboto, sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--body); background:var(--ink); color:var(--text);
  line-height:1.5; -webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 500px at 80% -10%, rgba(245,179,1,.10), transparent 60%),
                   radial-gradient(900px 500px at -10% 10%, rgba(23,195,178,.08), transparent 55%);
  min-height:100vh; padding-bottom:env(safe-area-inset-bottom);
}
h1,h2,h3,h4{font-family:var(--disp); font-weight:700; letter-spacing:.2px; line-height:1.1}
a{color:var(--teal); text-decoration:none}
img{max-width:100%; display:block}
.wrap{max-width:var(--maxw); margin:0 auto; padding:0 18px}
.hidden{display:none !important}
.center{text-align:center}
.muted{color:var(--muted)}
.small{font-size:13px}
.tiny{font-size:12px}
.mono{font-variant-numeric:tabular-nums}

/* ---------- Header ---------- */
.topbar{position:sticky; top:0; z-index:40; backdrop-filter:blur(10px);
  background:rgba(15,27,45,.82); border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex; align-items:center; gap:14px; height:64px}
.brand{display:flex; align-items:center; gap:11px; cursor:pointer}
.plate{font-family:var(--disp); font-weight:800; background:var(--plate); color:#0c1016;
  border:2px solid #0c1016; border-radius:8px; padding:3px 9px; font-size:20px; letter-spacing:1px;
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.25); line-height:1}
.brand .bn{font-family:var(--disp); font-weight:700; font-size:19px; letter-spacing:.4px}
.brand .bn small{display:block; font-size:10.5px; letter-spacing:2px; color:var(--amber); font-weight:600; margin-top:1px}
.nav-actions{margin-left:auto; display:flex; align-items:center; gap:8px}
.chip{font-size:12px; color:var(--muted); border:1px solid var(--line); padding:5px 10px; border-radius:999px; white-space:nowrap}

/* ---------- Buttons ---------- */
.btn{font-family:var(--body); font-weight:600; font-size:14px; cursor:pointer;
  border:1px solid var(--line); background:var(--surface); color:var(--text);
  padding:10px 16px; border-radius:10px; display:inline-flex; align-items:center; gap:8px;
  transition:transform .06s ease, background .15s ease, border-color .15s ease; white-space:nowrap}
.btn:hover{border-color:var(--muted-2)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:2px solid var(--teal); outline-offset:2px}
.btn-amber{background:var(--amber); color:#0c1016; border-color:var(--amber)}
.btn-amber:hover{background:var(--amber-d); border-color:var(--amber-d)}
.btn-teal{background:var(--teal); color:#04201d; border-color:var(--teal)}
.btn-danger{background:transparent; color:#ffb4b4; border-color:#5a3030}
.btn-danger:hover{background:#3a1f1f; border-color:var(--red-d)}
.btn-ghost{background:transparent}
.btn-sm{padding:7px 12px; font-size:13px; border-radius:9px}
.btn-block{width:100%; justify-content:center}
.btn[disabled]{opacity:.5; cursor:not-allowed}

/* ---------- Hero ---------- */
.hero{padding:54px 0 30px; position:relative}
.hero-grid{display:grid; grid-template-columns:1.15fr .85fr; gap:34px; align-items:center}
.eyebrow{display:inline-flex; align-items:center; gap:8px; font-family:var(--disp);
  letter-spacing:2px; font-size:12px; color:var(--amber); text-transform:uppercase; font-weight:600;
  border:1px solid var(--line); padding:6px 12px; border-radius:999px; margin-bottom:16px}
.hero h1{font-size:clamp(34px,5.4vw,58px); font-weight:800; letter-spacing:.5px}
.hero h1 .hl{color:var(--amber)}
.hero p.lead{color:var(--muted); font-size:17px; max-width:44ch; margin:16px 0 24px}
.hero-cta{display:flex; gap:12px; flex-wrap:wrap}
.hero-stats{display:flex; gap:26px; margin-top:30px}
.hero-stats .s b{font-family:var(--disp); font-size:26px; display:block; color:var(--text)}
.hero-stats .s span{font-size:12px; color:var(--muted); letter-spacing:.5px}
.hero-visual{position:relative; aspect-ratio:1/1; border-radius:22px; overflow:hidden;
  border:1px solid var(--line); background:
   radial-gradient(120% 120% at 70% 20%, rgba(245,179,1,.22), transparent 55%),
   linear-gradient(160deg,#15263e,#0d1626);
  display:grid; place-items:center}
.hero-visual .roadmark{position:absolute; inset:auto 0 22% 0; height:8px;
  background:repeating-linear-gradient(90deg, var(--amber) 0 34px, transparent 34px 64px); opacity:.55}
.hero-visual .bigcar{width:78%; filter:drop-shadow(0 18px 30px rgba(0,0,0,.5))}
.hero-visual .badge-float{position:absolute; top:20px; left:20px; background:rgba(12,16,22,.7);
  border:1px solid var(--line); border-radius:12px; padding:9px 12px; font-size:12px; color:var(--muted)}

/* ---------- Sections ---------- */
.section{padding:34px 0}
.section-head{display:flex; align-items:end; justify-content:space-between; gap:14px; margin-bottom:20px; flex-wrap:wrap}
.section-head h2{font-size:30px}
.section-head .sub{color:var(--muted); font-size:14px; margin-top:4px}

/* ---------- Fleet grid ---------- */
.fleet-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:18px}
.car{background:linear-gradient(180deg,var(--ink-2),#132038); border:1px solid var(--line);
  border-radius:var(--radius); overflow:hidden; display:flex; flex-direction:column; transition:border-color .15s, transform .12s}
.car:hover{border-color:var(--muted-2); transform:translateY(-2px)}
.car-media{aspect-ratio:16/10; position:relative; display:grid; place-items:center; overflow:hidden;
  background:radial-gradient(120% 120% at 60% 20%, rgba(245,179,1,.16), transparent 60%), #0f1c30}
.car-media .car-photo{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:1}
.car-media .cat,.car-media .avail{z-index:2}
.car-media .glyph{width:90%; opacity:.95}
.car-media .cat{position:absolute; top:10px; left:10px; font-size:11px; letter-spacing:.6px;
  background:rgba(12,16,22,.72); border:1px solid var(--line); padding:4px 9px; border-radius:999px; color:var(--muted)}
.car-media .avail{position:absolute; top:10px; right:10px; font-size:11px; padding:4px 9px; border-radius:999px; font-weight:600}
.avail.on{background:rgba(34,197,94,.15); color:#7ff0a8; border:1px solid #275c3c}
.avail.off{background:rgba(239,68,68,.12); color:#ff9b9b; border:1px solid #5a3030}
.car-body{padding:14px; display:flex; flex-direction:column; gap:10px; flex:1}
.car-title{font-family:var(--disp); font-size:19px; font-weight:700}
.car-specs{display:flex; flex-wrap:wrap; gap:6px}
.spec{font-size:11.5px; color:var(--muted); border:1px solid var(--line-soft); padding:3px 8px; border-radius:7px}
.price-row{display:flex; align-items:baseline; gap:6px; margin-top:auto}
.price{font-family:var(--disp); font-size:24px; font-weight:800; color:var(--amber)}
.price small{font-size:12px; color:var(--muted); font-weight:500}
.car-actions{display:flex; gap:8px}

/* ---------- Forms ---------- */
.field{margin-bottom:14px}
.field label{display:block; font-size:13px; color:var(--muted); margin-bottom:6px; font-weight:500}
.input,select,textarea{width:100%; font-family:var(--body); font-size:14.5px; color:var(--text);
  background:#0f1d31; border:1px solid var(--line); border-radius:10px; padding:11px 13px; outline:none; transition:border-color .15s}
.input:focus,select:focus,textarea:focus{border-color:var(--teal)}
textarea{resize:vertical; min-height:78px}
select{appearance:none; background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 18px) 18px,calc(100% - 13px) 18px; background-size:5px 5px,5px 5px; background-repeat:no-repeat}
.grid-2{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.form-err{color:#ff9b9b; font-size:13px; margin:2px 0 10px; min-height:0}

/* ---------- Cards / panels ---------- */
.card{background:var(--ink-2); border:1px solid var(--line); border-radius:var(--radius); padding:22px}
.auth-wrap{max-width:430px; margin:40px auto}
.auth-tabs{display:flex; gap:6px; background:#0f1d31; border:1px solid var(--line); border-radius:12px; padding:5px; margin-bottom:20px}
.auth-tabs button{flex:1; background:transparent; border:none; color:var(--muted); font-family:var(--body);
  font-weight:600; font-size:14px; padding:9px; border-radius:8px; cursor:pointer}
.auth-tabs button.active{background:var(--surface); color:var(--text)}

/* ---------- Dashboard ---------- */
.dash-head{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin:26px 0 18px}
.dash-head h2{font-size:28px}
.tabs{display:flex; gap:6px; flex-wrap:wrap; border-bottom:1px solid var(--line); margin-bottom:22px; overflow-x:auto}
.tab{background:transparent; border:none; border-bottom:2px solid transparent; color:var(--muted);
  font-family:var(--body); font-weight:600; font-size:14px; padding:11px 14px; cursor:pointer; white-space:nowrap}
.tab.active{color:var(--text); border-bottom-color:var(--amber)}
.stat-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:14px; margin-bottom:22px}
.stat{background:var(--ink-2); border:1px solid var(--line); border-radius:12px; padding:16px 18px}
.stat .n{font-family:var(--disp); font-size:30px; font-weight:800}
.stat .l{font-size:12.5px; color:var(--muted); letter-spacing:.4px; margin-top:2px}
.stat.amber .n{color:var(--amber)} .stat.teal .n{color:var(--teal)} .stat.green .n{color:#7ff0a8}

/* ---------- Table ---------- */
.tbl-scroll{overflow-x:auto; border:1px solid var(--line); border-radius:12px}
table.tbl{width:100%; border-collapse:collapse; font-size:13.5px; min-width:560px}
.tbl th{ text-align:left; font-family:var(--disp); font-weight:600; letter-spacing:.4px; color:var(--muted);
  font-size:12px; text-transform:uppercase; padding:12px 14px; border-bottom:1px solid var(--line); background:#0f1d31}
.tbl td{padding:12px 14px; border-bottom:1px solid var(--line-soft); vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:rgba(255,255,255,.02)}
.pill{font-size:11.5px; font-weight:600; padding:3px 9px; border-radius:999px; display:inline-block}
.pill.pending{background:rgba(245,179,1,.14); color:var(--amber); border:1px solid #6a5417}
.pill.confirmed{background:rgba(23,195,178,.14); color:#5fe6d7; border:1px solid #1c5a53}
.pill.completed{background:rgba(34,197,94,.14); color:#7ff0a8; border:1px solid #275c3c}
.pill.cancelled{background:rgba(239,68,68,.12); color:#ff9b9b; border:1px solid #5a3030}
.pill.admin{background:rgba(245,179,1,.14); color:var(--amber); border:1px solid #6a5417}
.pill.user{background:rgba(147,164,187,.12); color:var(--muted); border:1px solid var(--line)}
.row-actions{display:flex; gap:6px; flex-wrap:wrap}

/* ---------- Modal ---------- */
.modal-back{position:fixed; inset:0; background:rgba(6,10,18,.72); backdrop-filter:blur(4px);
  z-index:60; display:grid; place-items:center; padding:16px; overflow-y:auto}
.modal{background:var(--ink-2); border:1px solid var(--line); border-radius:16px; width:100%;
  max-width:520px; box-shadow:var(--shadow); max-height:92vh; overflow-y:auto}
.modal-head{display:flex; align-items:center; justify-content:space-between; padding:18px 20px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--ink-2)}
.modal-head h3{font-size:20px}
.modal-body{padding:20px}
.x{background:transparent; border:none; color:var(--muted); font-size:22px; cursor:pointer; line-height:1; padding:2px 6px; border-radius:8px}
.x:hover{color:var(--text); background:var(--surface)}

/* ---------- Toast ---------- */
#toast{position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(20px);
  background:#0c1016; border:1px solid var(--line); color:var(--text); padding:12px 18px; border-radius:12px;
  font-size:14px; z-index:90; opacity:0; transition:.25s; box-shadow:var(--shadow); max-width:90vw}
#toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
#toast.ok{border-color:#275c3c} #toast.err{border-color:#5a3030}

/* ---------- Footer ---------- */
.footer{border-top:1px solid var(--line); margin-top:40px; padding:30px 0; color:var(--muted); font-size:13.5px}
.footer .fg{display:flex; justify-content:space-between; gap:20px; flex-wrap:wrap}
.footer a{color:var(--amber)}
.note{background:rgba(245,179,1,.07); border:1px solid #4a3d17; color:#f0d79a; font-size:12.5px;
  padding:10px 12px; border-radius:10px; margin-top:14px}

/* ---------- Install banner ---------- */
#installBar{position:fixed; left:16px; right:16px; bottom:16px; z-index:50; max-width:520px; margin:0 auto;
  background:#0c1016; border:1px solid var(--amber); border-radius:14px; padding:12px 14px; display:none;
  align-items:center; gap:12px; box-shadow:var(--shadow)}
#installBar b{font-family:var(--disp)}

@media (max-width:820px){
  .hero-grid{grid-template-columns:1fr; gap:22px}
  .hero-visual{max-width:360px; margin:0 auto; width:100%}
  .grid-2{grid-template-columns:1fr}
  .topbar .chip.hide-sm{display:none}
}
@media (max-width:480px){
  .hero-stats{gap:18px}
  .brand .bn{font-size:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}

<script>
/* ============================================================
   OK MOBILITY CAR RENTALS & HIRE  —  client-side portal
   Data is stored in Firebase (Firestore + Auth), shared across devices.
   ============================================================ */

/* ============================================================
   DATA LAYER — Firebase (Firestore + Auth). One shared database
   across every device: a booking on a phone appears in admin on a laptop.
   ============================================================ */
const auth = firebase.auth();
const fdb  = firebase.firestore();

/* in-memory cache kept live by Firestore listeners, so the synchronous views can read it */
const STATE = { user:null, cars:[], bookings:[], users:[], settings:null, ready:false };
const K = { cars:'cars', bookings:'bookings', users:'users', settings:'settings' };
const DB = {  // read adapter: existing view code calls DB.get(K.x); serve from STATE
  get(k, def){
    if(k===K.cars) return STATE.cars;
    if(k===K.bookings) return STATE.bookings;
    if(k===K.users) return STATE.users;
    if(k===K.settings) return STATE.settings || def || null;
    return def;
  },
  set(){ /* writes go through Firestore helpers below */ }
};

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KES = n => 'KES ' + Number(n||0).toLocaleString('en-KE');
const todayISO = () => new Date().toISOString().slice(0,10);
function toast(msg, type){ const t=$('#toast'); t.textContent=msg; t.className='show '+(type||''); setTimeout(()=>t.className='',2600); }
function authMsg(e){ const m={'auth/invalid-email':'That email looks invalid.','auth/user-not-found':'No account with that email.','auth/wrong-password':'Incorrect password.','auth/invalid-credential':'Incorrect email or password.','auth/email-already-in-use':'That email is already registered.','auth/weak-password':'Password must be at least 6 characters.','auth/too-many-requests':'Too many attempts. Try again later.','auth/network-request-failed':'Network error. Check your connection.'}; return m[e&&e.code] || (e&&e.message) || 'Something went wrong.'; }

/* ---------- settings ---------- */
const DEFAULT_SETTINGS = { name:'OK Mobility', tagline:'CAR RENTALS & HIRE',
  phone:'0726049772', whatsapp:'254726049772', location:'Kenya', email:'' };
function settings(){ return STATE.settings || DEFAULT_SETTINGS; }

/* ---------- free stock photos (Unsplash License: free commercial use, no attribution) ---------- */
const uImg = id => `https://images.unsplash.com/photo-${id}?w=800&h=520&fit=crop&q=70&auto=format`;
const STOCK = {
  'Toyota Vitz':'1604430096113-f3806ab7c810',
  'Toyota Axio':'1573710459621-bb101783ca0f',
  'Toyota Fielder':'1766918070462-20206f5610f6',
  'Toyota Noah':'1675311183084-755007dbb223',
  'Nissan X-Trail':'1533473359331-0135ef1b58bf',
  'Toyota Harrier':'1622893288761-823ba60f17a6',
  'Mazda CX-5':'1531181616225-f8e50c1ab53e',
  'Subaru Forester':'1606611013016-969c19ba27bb',
  'Toyota Prado':'1506015391300-4802dc74de2e',
  'Toyota Land Cruiser V8':'1612563893490-d86ed296e5e6',
  'Toyota Hilux Double Cab':'1612057473166-af2affdb92ad',
  'Toyota Hiace 14-Seater':'1521499420147-36d5bfc2781f',
};
function stockFor(name){ return STOCK[name] ? uImg(STOCK[name]) : ''; }

/* ---------- starter fleet (created by an admin only, when the fleet is empty) ---------- */
const SEED_CARS = [
  ['Toyota Vitz','Hatchback',2800,'Automatic','Petrol',5,'Compact, fuel-saving hatchback — perfect for city runs.'],
  ['Toyota Axio','Sedan',3500,'Automatic','Petrol',5,'Comfortable, economical sedan for daily hire.'],
  ['Toyota Fielder','Wagon',4000,'Automatic','Petrol',5,'Roomy station wagon with a big boot for luggage.'],
  ['Toyota Noah','MPV',7000,'Automatic','Petrol',8,'7–8 seater family van, ideal for trips and groups.'],
  ['Nissan X-Trail','SUV',6500,'Automatic','Petrol',5,'Comfortable SUV for family travel and light off-road.'],
  ['Toyota Harrier','SUV',9000,'Automatic','Petrol',5,'Premium SUV — stylish, smooth and spacious.'],

async function seedIfEmpty(){
  if(!STATE.user || STATE.user.role!=='admin') return;
  try{
    const snap = await fdb.collection('cars').limit(1).get();
    if(!snap.empty) return;
    const batch = fdb.batch();
    SEED_CARS.forEach(c=>{ const ref=fdb.collection('cars').doc();
      batch.set(ref, { name:c[0], category:c[1], price:c[2], transmission:c[3], fuel:c[4],
        seats:c[5], desc:c[6], image:stockFor(c[0]), available:true, createdAt:Date.now() }); });
    batch.set(fdb.collection('settings').doc('app'), DEFAULT_SETTINGS, { merge:true });
    await batch.commit(); toast('Starter fleet loaded','ok');
  }catch(e){ console.warn('seed skipped', e); }
}

/* ---------- realtime listeners -> STATE ---------- */
const _unsub = {};
function detachAll(){ Object.keys(_unsub).forEach(k=>{ try{ _unsub[k] && _unsub[k](); }catch(e){} delete _unsub[k]; }); }
function attachListeners(){
  detachAll();
  _unsub.settings = fdb.collection('settings').doc('app').onSnapshot(
    d => { STATE.settings = d.exists ? d.data() : DEFAULT_SETTINGS; render(); },
    e => { STATE.settings = STATE.settings || DEFAULT_SETTINGS; });
  _unsub.cars = fdb.collection('cars').onSnapshot(
    s => { STATE.cars = s.docs.map(d=>({ id:d.id, ...d.data() })).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0)); render(); },
    e => console.warn('cars listen', e));
  const u = STATE.user;
  if(u && u.role==='admin'){
    _unsub.bookings = fdb.collection('bookings').onSnapshot(
      s => { STATE.bookings = s.docs.map(d=>({ id:d.id, ...d.data() })); render(); }, e=>console.warn('bookings', e));
    _unsub.users = fdb.collection('users').onSnapshot(
      s => { STATE.users = s.docs.map(d=>({ id:d.id, ...d.data() })); render(); }, e=>console.warn('users', e));
  } else if(u){
    _unsub.bookings = fdb.collection('bookings').where('userId','==',u.uid).onSnapshot(
      s => { STATE.bookings = s.docs.map(d=>({ id:d.id, ...d.data() })); render(); }, e=>console.warn('own bookings', e));
    STATE.users = [];
  } else { STATE.bookings = []; STATE.users = []; }
}

/* ---------- session / auth state ---------- */
function currentUser(){ return STATE.user; }
function logout(){ auth.signOut().then(()=>{ toast('Signed out'); go('home'); }); }

auth.onAuthStateChanged(async (fbUser) => {
  detachAll();
  if(fbUser){
    let role='user', username = fbUser.displayName || (fbUser.email||'').split('@')[0];
    try{
      const uref = fdb.collection('users').doc(fbUser.uid);
      const snap = await uref.get();
      if(snap.exists){ const d=snap.data(); role=d.role||'user'; username=d.username||username; }
      else { await uref.set({ username, email:fbUser.email, role:'user', createdAt:Date.now() }); }
    }catch(e){ console.warn('profile', e); }
    STATE.user = { uid:fbUser.uid, email:fbUser.email, username, role };
    attachListeners(); seedIfEmpty();
  } else {
    STATE.user = null; attachListeners();
  }
  STATE.ready = true; render();
});

  const G=(d)=>`<path d="${d}" fill="#0b1524" stroke="${tint}" stroke-width="2.5" stroke-linejoin="round"/>`;
  const head=(x,y)=>`<circle cx="${x}" cy="${y}" r="3.4" fill="${tint}"/>`;
  let wa=64, wb=156, parts='';

      +G("M80,45 L100,45 L100,60 L70,60 Z")+G("M106,45 L150,45 L150,60 L106,60 Z")+head(168,72);
  } else if(type==='wagon'){
    parts=B("M28,88 L28,70 Q28,66 34,65 L58,62 L76,48 Q80,44 88,44 L172,44 Q182,44 184,52 L188,64 Q190,66 190,70 L190,88 Z")
      +G("M84,47 L102,47 L102,61 L74,61 Z")+G("M108,47 L150,47 L150,61 L108,61 Z")+G("M156,47 L180,47 L182,61 L156,61 Z")+head(188,72);

      +G("M82,43 L104,43 L104,57 L72,57 Z")+G("M110,43 L150,43 L156,57 L110,57 Z")+head(190,68);
  } else if(type==='offroad'){ wa=64; wb=160;

      +G("M56,40 L96,40 L96,54 L56,54 Z")+G("M102,40 L150,40 L150,54 L102,54 Z")+G("M156,40 L176,40 L176,54 L156,54 Z")
      +`<line x1="46" y1="33" x2="150" y2="33" stroke="${tint}" stroke-width="3" opacity=".5"/>`+head(192,64);
  } else if(type==='van'){ wa=60; wb=166;
    parts=B("M20,90 L20,50 Q20,44 28,44 L176,44 Q192,44 196,54 L200,72 Q202,74 202,78 L202,90 Z")
      +G("M28,50 L60,50 L60,66 L28,66 Z")+G("M66,50 L96,50 L96,66 L66,66 Z")+G("M102,50 L132,50 L132,66 L102,66 Z")+G("M138,50 L176,50 L184,66 L138,66 Z")+head(200,74);

async function doLogin(){
  const email=$('#liUser').value.trim(); const pw=$('#liPass').value; const err=$('#liErr');
  if(!email||!pw){ err.textContent='Enter your email and password.'; return; }
  err.textContent='Signing in…';
  try{ await auth.signInWithEmailAndPassword(email, pw); toast('Signed in','ok'); go('account'); }
  catch(e){ err.textContent=authMsg(e); }
}
async function doRegister(){
  const un=$('#rgUser').value.trim(); const em=$('#rgEmail').value.trim();
  const pw=$('#rgPass').value; const cf=$('#rgConf').value; const err=$('#rgErr');
  if(!un||!em||!pw){ err.textContent='Fill in all fields.'; return; }
  if(pw.length<6){ err.textContent='Password must be at least 6 characters.'; return; }
  if(pw!==cf){ err.textContent='Passwords do not match.'; return; }
  err.textContent='Creating account…';
  try{
    const cred = await auth.createUserWithEmailAndPassword(em, pw);
    try{ await cred.user.updateProfile({ displayName:un }); }catch(e){}
    try{ await fdb.collection('users').doc(cred.user.uid).set({ username:un, email:em, role:'user', createdAt:Date.now() }); }catch(e){ console.warn(e); }
    toast('Account created. Welcome!','ok'); go('account');
  }catch(e){ err.textContent=authMsg(e); }
}
async function changePassword(){
  const err=$('#cpErr');
  const oldp=$('#cpOld').value, np=$('#cpNew').value, cf=$('#cpConf').value;
  if(!oldp||!np){ err.textContent='Fill in all fields.'; return; }
  if(np.length<6){ err.textContent='New password must be at least 6 characters.'; return; }
  if(np!==cf){ err.textContent='New passwords do not match.'; return; }
  const user=auth.currentUser; if(!user){ err.textContent='Please sign in again.'; return; }
  err.textContent='Updating…';
  try{
    const cred = firebase.auth.EmailAuthProvider.credential(user.email, oldp);
    await user.reauthenticateWithCredential(cred);
    await user.updatePassword(np);
    toast('Password updated','ok'); go('account');
  }catch(e){ err.textContent = (e&&e.code==='auth/wrong-password') ? 'Current password is incorrect.' : authMsg(e); }
}
async function forgotPassword(){
  const email=$('#liUser').value.trim(); const err=$('#liErr');
  if(!email){ err.textContent='Type your email above first, then tap Forgot password.'; return; }
  try{ await auth.sendPasswordResetEmail(email); err.textContent=''; toast('Password reset email sent','ok'); }
  catch(e){ err.textContent=authMsg(e); }
}

function days(a,b){ if(!a||!b) return 1; const d=Math.ceil((new Date(b)-new Date(a))/86400000); return Math.max(1,d||1); }
function collectBooking(carId){
  const car=DB.get(K.cars,[]).find(c=>c.id===carId);
  const name=$('#bkName').value.trim(), phone=$('#bkPhone').value.trim();
  const email=$('#bkEmail').value.trim(), idno=$('#bkId').value.trim();
  const start=$('#bkStart').value, end=$('#bkEnd').value, notes=$('#bkNotes').value.trim();
  if(!name||!phone||!start||!end){ $('#bkErr').textContent='Name, phone, pick-up and return dates are required.'; return null; }
  if(new Date(end)<new Date(start)){ $('#bkErr').textContent='Return date cannot be before pick-up date.'; return null; }
  const d=days(start,end); const u=currentUser();

    userId:u?u.uid:null, createdAt:Date.now() };

function setImgPreview(src){
  const p=$('#imgPrev'); if(!p) return;
  p.innerHTML = src ? `<img src="${esc(src)}" style="width:100%;height:100%;object-fit:cover" onerror="this.parentNode.innerHTML='<span class=\\'tiny muted\\'>Bad image</span>'">`
                    : `<span class="tiny muted">No photo</span>`;

function resizeImage(file, maxW, cb){
  const reader=new FileReader();
  reader.onload=()=>{ const img=new Image();
    img.onload=()=>{ let w=img.width, h=img.height;
      if(w>maxW){ h=Math.round(h*maxW/w); w=maxW; }
      const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      cb(cv.toDataURL('image/jpeg',0.72));
    };
    img.onerror=()=>toast('Could not read that image','err');
    img.src=reader.result; };
  reader.readAsDataURL(file);
}

// Normalise a Kenyan phone number to wa.me format (2547XXXXXXXX)
function waNum(phone){
  let n=String(phone||'').replace(/[^0-9]/g,'');
  if(n.startsWith('0')) n='254'+n.slice(1);
  else if(n.startsWith('7')||n.startsWith('1')) n='254'+n;
  return n;
}
// Build the customer-facing WhatsApp message for a status change
function bookingUpdateMsg(b,st,s){
  const biz=s.name||'OK Mobility';
  const contact=s.phone||s.whatsapp||'';
  const car=b.carName||'your car';
  if(st==='confirmed')
    return `Hello ${b.name}, your booking with ${biz} is CONFIRMED \u2705\n\nCar: ${car}\nPick-up: ${b.start}\nReturn: ${b.end} (${b.days} day/s)\nTotal: ${KES(b.total)}\n\nThank you for choosing us. For anything, call or WhatsApp ${contact}.`;
  if(st==='completed')
    return `Hello ${b.name}, your hire with ${biz} is now marked COMPLETE \uD83D\uDE97\n\nCar: ${car}\nPeriod: ${b.start} \u2192 ${b.end}\n\nThank you for your business \u2014 we hope to serve you again!`;
  if(st==='cancelled')
    return `Hello ${b.name}, we're sorry to let you know your booking with ${biz} has been CANCELLED.\n\nCar: ${car}\nDates: ${b.start} \u2192 ${b.end}\n\nPlease contact us on ${contact} with any questions.`;
  return '';
}

function exportBookingsCSV(){

  const head=['Name','Phone','Email','ID','Car','PickUp','Return','Days','PricePerDay','Total','Status','Requested'];

  const a=document.createElement('a'); a.href=url; a.download='okmobility-bookings-'+todayISO()+'.csv'; a.click();

      <div class="card"><h3 style="font-size:18px;margin-bottom:16px">Revenue by car (confirmed)</h3>${bars}</div>
      <div class="card"><h3 style="font-size:18px;margin-bottom:16px">Bookings by status</h3>
        ${statuses.map(([s,n])=>`<div style="display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line-soft)">
          <span class="pill ${s}">${s}</span><b class="mono">${n}</b></div>`).join('')}
        <button class="btn btn-ghost btn-block" style="margin-top:16px" onclick="exportBookingsCSV()">⬇ Export bookings CSV</button>
      </div>
    </div>`;
}

/* ----- Users ----- */
function adminUsers(){
  const users=DB.get(K.users,[]); const me=currentUser();
  const rows=users.map(u=>`
    <tr><td><b>${esc(u.username||'—')}</b>${u.id===me.uid?' <span class="tiny muted">(you)</span>':''}</td>
      <td class="tiny muted">${esc(u.email||'')}</td>
      <td><span class="pill ${u.role}">${u.role}</span></td>
      <td class="tiny muted">${u.createdAt?new Date(u.createdAt).toLocaleDateString('en-KE'):''}</td>
      <td><div class="row-actions">
        <button class="btn btn-sm btn-ghost" onclick="toggleRole('${u.id}')">${u.role==='admin'?'Make user':'Make admin'}</button>
        <button class="btn btn-sm btn-ghost" onclick="sendReset('${esc(u.email||'')}')">Send reset</button>
        ${u.id===me.uid?'':`<button class="btn btn-sm btn-danger" onclick="deleteUser('${u.id}')">Delete</button>`}
      </div></td>
    </tr>`).join('') || `<tr><td colspan="5" class="muted center" style="padding:24px">No accounts yet.</td></tr>`;
  return `<div class="section-head"><div><h3 style="font-size:22px">Users</h3>
      <div class="sub">People sign up themselves on the login screen. Promote them to admin here.</div></div></div>
    <div class="tbl-scroll"><table class="tbl">
      <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Joined</th><th>Actions</th></tr></thead>
      <tbody>${rows}</tbody></table></div>
    <div class="note">To create a new admin: have the person register on the login screen, then tap “Make admin” next to their name. “Send reset” emails them a password-reset link. “Delete” removes their access here; to fully delete the sign-in account, remove it under Authentication in the Firebase console.</div>`;
}
async function toggleRole(id){
  const users=DB.get(K.users,[]); const u=users.find(x=>x.id===id); if(!u) return;
  if(u.role==='admin' && users.filter(x=>x.role==='admin').length<=1){ toast('Keep at least one admin','err'); return; }
  const next=u.role==='admin'?'user':'admin';
  try{ await fdb.collection('users').doc(id).update({ role:next }); toast('Role updated','ok'); }
  catch(e){ toast('Update failed','err'); }
}
async function sendReset(email){
  if(!email){ toast('No email on file','err'); return; }
  try{ await auth.sendPasswordResetEmail(email); toast('Reset email sent to '+email,'ok'); }
  catch(e){ toast(authMsg(e),'err'); }
}
function deleteUser(id){
  const u=DB.get(K.users,[]).find(x=>x.id===id);
  confirmModal('Remove user?',`Remove access for <b>${esc(u.username||u.email||'this user')}</b>? (Their sign-in account stays until you delete it in the Firebase console.)`,async ()=>{
    closeModal();
    try{ await fdb.collection('users').doc(id).delete(); toast('User removed','ok'); }catch(e){ toast('Delete failed','err'); }
  });
}

/* ----- Settings ----- */
function adminSettings(){
  const s=settings();
  return `<div style="max-width:560px">
    <div class="section-head"><div><h3 style="font-size:22px">Business settings</h3>
      <div class="sub">These appear across the site and on WhatsApp bookings.</div></div></div>
    <div class="card">
      <div class="grid-2">
        <div class="field"><label>Business name</label><input class="input" id="stName" value="${esc(s.name)}"></div>
        <div class="field"><label>Tagline</label><input class="input" id="stTag" value="${esc(s.tagline)}"></div>
      </div>
      <div class="grid-2">
        <div class="field"><label>Phone</label><input class="input" id="stPhone" value="${esc(s.phone)}"></div>
        <div class="field"><label>WhatsApp number (with country code)</label><input class="input" id="stWa" value="${esc(s.whatsapp)}"></div>
      </div>
      <div class="grid-2">
        <div class="field"><label>Location</label><input class="input" id="stLoc" value="${esc(s.location)}"></div>
        <div class="field"><label>Email (optional)</label><input class="input" id="stEmail" value="${esc(s.email||'')}"></div>
      </div>
      <button class="btn btn-amber btn-block" onclick="saveBiz()">Save settings</button>
    </div>

    <div class="card" style="margin-top:16px">
      <h3 style="font-size:18px;margin-bottom:10px">Data & backup</h3>
      <p class="muted small" style="margin-bottom:14px">Your data lives in Firebase (Firestore) and is shared across every device in real time. You can download a snapshot anytime.</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn btn-ghost btn-sm" onclick="exportData()">⬇ Download snapshot (JSON)</button>
        <button class="btn btn-ghost btn-sm" onclick="exportBookingsCSV()">⬇ Bookings CSV</button>
      </div>
      <div class="note">This version uses one shared cloud database, so a booking made on any phone appears in your admin on any device. It needs an internet connection. Manage accounts and back-end data in your Firebase console.</div>
    </div>
  </div>`;
}
async function saveBiz(){
  const s={ name:$('#stName').value.trim()||'OK Mobility', tagline:$('#stTag').value.trim(),
    phone:$('#stPhone').value.trim(), whatsapp:$('#stWa').value.replace(/[^0-9]/g,''),
    location:$('#stLoc').value.trim()||'Kenya', email:$('#stEmail').value.trim() };
  try{ await fdb.collection('settings').doc('app').set(s,{merge:true}); toast('Settings saved','ok'); }
  catch(e){ toast('Could not save settings','err'); }
}
function exportData(){
  const data={ cars:DB.get(K.cars,[]), bookings:DB.get(K.bookings,[]), users:DB.get(K.users,[]), settings:settings() };
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}); const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download='okmobility-snapshot-'+todayISO()+'.json'; a.click(); URL.revokeObjectURL(url);
  toast('Snapshot downloaded','ok');
}

/* ============================================================
   MODALS
   ============================================================ */
function showModal(title, bodyHtml){
  $('#modalRoot').innerHTML=`<div class="modal-back" onclick="if(event.target===this)closeModal()">
    <div class="modal"><div class="modal-head"><h3>${title}</h3><button class="x" onclick="closeModal()">×</button></div>
    <div class="modal-body">${bodyHtml}</div></div></div>`;
}
function closeModal(){ $('#modalRoot').innerHTML=''; }
function confirmModal(title, msg, onYes){
  window.__yes=onYes;
  showModal(title, `<p style="margin-bottom:18px">${msg}</p>
    <div style="display:flex;gap:10px;justify-content:flex-end">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-danger" onclick="(window.__yes&&window.__yes());">Yes, continue</button>
    </div>`);
}

/* ============================================================
   BIND (post-render hooks) + BOOT
   ============================================================ */
function bindView(){ /* handlers are inline; reserved for future */ }

let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',(e)=>{ e.preventDefault(); deferredPrompt=e;
  const bar=document.getElementById('installBar'); if(bar) bar.style.display='flex'; });
document.getElementById('installBtn').addEventListener('click',async()=>{
  document.getElementById('installBar').style.display='none';
  if(deferredPrompt){ deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt=null; }
});

(function boot(){
  render(); // first paint (auth listener re-renders once Firebase resolves)
  if('serviceWorker' in navigator){
    window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
  }
})();
</script>
</body>
</html>
