<!DOCTYPE html>
<html lang="en-KE" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>OK Mobility Car Rentals & Hire</title>
<meta name="description" content="OK Mobility — Cars Rental And Beyond. Book and manage self-drive or chauffeured car rentals in Kenya.">
<meta name="theme-color" content="#FFFFFF" id="metaTheme">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon.png" type="image/png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
  /* apply saved theme before first paint (default = light) */
  (function(){ var t='light'; try{ t=localStorage.getItem('okm-theme')||'light'; }catch(e){}
    document.documentElement.setAttribute('data-theme', t); })();
</script>
<style>
:root{
  /* ---------- LIGHT (default) ---------- */
  --bg:#F4F8FC; --bg-2:#EAF1F9; --card:#FFFFFF; --card-2:#F7FAFD; --input:#F3F7FB;
  --line:#DCE6F1; --line-soft:#E8EFF7;
  --text:#0E2038; --muted:#5B6F88; --muted-2:#8A9BB1;
  --amber:#0B5CC4;       /* PRIMARY brand blue (from logo) */
  --amber-d:#084A9F;
  --on-amber:#FFFFFF;
  --teal:#5E9F1F;        /* ACCENT brand green (from logo) */
  --teal-d:#4C8318;
  --on-teal:#FFFFFF;
  --green:#22A55B; --red:#E04848; --red-d:#C23A3A;
  --head-bg:rgba(255,255,255,.82);
  --shadow:0 12px 34px rgba(16,52,102,.12);
  --shadow-sm:0 4px 14px rgba(16,52,102,.08);
  --glow1:rgba(11,92,196,.12); --glow2:rgba(94,159,31,.12);
  --media-bg:linear-gradient(160deg,#EAF2FD,#F6FAEF);
  --wheel:#16263D; --glass:#16263D;
  --t-ok:#157A43; --t-warn:#9A6A00; --t-err:#B73535; --t-info:#0B5CC4;
  --b-ok:#BFE6CF; --b-warn:#F1DDA3; --b-err:#F2C4C4; --b-info:#C3D9F5;
  --bg-ok:rgba(34,165,91,.12); --bg-warn:rgba(245,179,1,.16); --bg-err:rgba(224,72,72,.10); --bg-info:rgba(11,92,196,.10);
  --cta-from:#0B5CC4; --cta-to:#1D7BE0;
  --radius:16px; --radius-sm:10px; --maxw:1160px;
  --disp:"Barlow Semi Condensed", system-ui, "Segoe UI", sans-serif;
  --body:"Inter", system-ui, "Segoe UI", Roboto, sans-serif;
}
[data-theme="dark"]{
  --bg:#0B1626; --bg-2:#0F1D31; --card:#14253C; --card-2:#182C47; --input:#0F1D31;
  --line:#243A57; --line-soft:#1D3150;
  --text:#F2F6FB; --muted:#9BB0C9; --muted-2:#6F86A3;
  --amber:#4C9AFF; --amber-d:#337FE6; --on-amber:#06162B;
  --teal:#8BD13F; --teal-d:#74B72D; --on-teal:#0B1A05;
  --green:#3DD17F; --red:#EF5A5A; --red-d:#C94444;
  --head-bg:rgba(11,22,38,.82);
  --shadow:0 14px 38px rgba(0,0,0,.45);
  --shadow-sm:0 4px 14px rgba(0,0,0,.35);
  --glow1:rgba(76,154,255,.16); --glow2:rgba(139,209,63,.10);
  --media-bg:linear-gradient(160deg,#162B47,#112239);
  --wheel:#0A1220; --glass:#0A1220;
  --t-ok:#7FE5A8; --t-warn:#F5C84B; --t-err:#FF9B9B; --t-info:#8FC2FF;
  --b-ok:#275c3c; --b-warn:#6a5417; --b-err:#5a3030; --b-info:#27518a;
  --bg-ok:rgba(61,209,127,.13); --bg-warn:rgba(245,179,1,.13); --bg-err:rgba(239,90,90,.12); --bg-info:rgba(76,154,255,.14);
  --cta-from:#0B4FA8; --cta-to:#1668D1;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{
  font-family:var(--body); background:var(--bg); color:var(--text);
  line-height:1.5; -webkit-font-smoothing:antialiased; min-height:100vh;
  padding-bottom:env(safe-area-inset-bottom);
  background-image:radial-gradient(900px 480px at 85% -8%, var(--glow1), transparent 60%),
                   radial-gradient(800px 480px at -8% 8%, var(--glow2), transparent 55%);
  background-attachment:fixed;
  transition:background-color .3s ease,color .3s ease;
}
h1,h2,h3,h4{font-family:var(--disp); font-weight:700; letter-spacing:.2px; line-height:1.1}
a{color:var(--amber); text-decoration:none}
img{max-width:100%; display:block}
.wrap{max-width:var(--maxw); margin:0 auto; padding:0 18px}
.hidden{display:none !important}
.center{text-align:center}
.muted{color:var(--muted)}
.small{font-size:13px}
.tiny{font-size:12px}
.mono{font-variant-numeric:tabular-nums}

/* ---------- Logo ---------- */
.logo-chip{display:inline-flex; align-items:center; background:#fff; border-radius:12px; padding:3px 10px; cursor:pointer;
  border:1px solid var(--line); box-shadow:var(--shadow-sm)}
.logo-chip img,.logo-chip svg{height:38px; width:auto; display:block}
.logo-chip.lg img,.logo-chip.lg svg{height:96px}
.logo-chip.md img,.logo-chip.md svg{height:58px}

/* ---------- Header ---------- */
.topbar{position:sticky; top:0; z-index:40; backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  background:var(--head-bg); border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex; align-items:center; gap:14px; height:68px}
.brand{display:flex; align-items:center; gap:11px}
.brand .btag{font-family:var(--disp); font-size:11px; letter-spacing:2.2px; color:var(--teal); font-weight:700; line-height:1.2}
.nav-actions{margin-left:auto; display:flex; align-items:center; gap:8px}
.chip{font-size:12px; color:var(--muted); border:1px solid var(--line); background:var(--card); padding:6px 11px; border-radius:999px; white-space:nowrap}
.theme-btn{width:42px; height:42px; border-radius:50%; border:1px solid var(--line); background:var(--card); color:var(--text);
  display:grid; place-items:center; cursor:pointer; box-shadow:var(--shadow-sm); transition:transform .25s ease, border-color .15s}
.theme-btn:hover{border-color:var(--amber); transform:rotate(18deg)}
.theme-btn:focus-visible{outline:2px solid var(--amber); outline-offset:2px}
.theme-btn svg{width:20px; height:20px}
.theme-btn .i-sun{display:none}
[data-theme="dark"] .theme-btn .i-sun{display:block}
[data-theme="dark"] .theme-btn .i-moon{display:none}

/* ---------- Buttons ---------- */
.btn{font-family:var(--body); font-weight:600; font-size:14px; cursor:pointer;
  border:1px solid var(--line); background:var(--card); color:var(--text);
  padding:10px 16px; border-radius:12px; display:inline-flex; align-items:center; gap:8px;
  transition:transform .08s ease, background .15s ease, border-color .15s ease, box-shadow .15s; white-space:nowrap}
.btn:hover{border-color:var(--muted-2)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:2px solid var(--amber); outline-offset:2px}
.btn-amber{background:linear-gradient(135deg,var(--amber),var(--amber-d)); color:var(--on-amber); border-color:transparent; box-shadow:0 6px 16px rgba(11,92,196,.28)}
.btn-amber:hover{filter:brightness(1.07); border-color:transparent}
.btn-teal{background:linear-gradient(135deg,var(--teal),var(--teal-d)); color:var(--on-teal); border-color:transparent}
.btn-teal:hover{filter:brightness(1.07); border-color:transparent}
.btn-danger{background:transparent; color:var(--t-err); border-color:var(--b-err)}
.btn-danger:hover{background:var(--bg-err); border-color:var(--red-d)}
.btn-ghost{background:transparent}
.btn-sm{padding:7px 12px; font-size:13px; border-radius:10px}
.btn-block{width:100%; justify-content:center}
.btn[disabled]{opacity:.5; cursor:not-allowed}

/* ---------- Hero ---------- */
.hero{padding:52px 0 26px; position:relative; overflow:hidden}
.hero-grid{display:grid; grid-template-columns:1.1fr .9fr; gap:36px; align-items:center}
.eyebrow{display:inline-flex; align-items:center; gap:8px; font-family:var(--disp);
  letter-spacing:2px; font-size:12px; color:var(--teal-d); text-transform:uppercase; font-weight:700;
  border:1px solid var(--line); background:var(--card); padding:7px 13px; border-radius:999px; margin-bottom:18px; box-shadow:var(--shadow-sm)}
[data-theme="dark"] .eyebrow{color:var(--teal)}
.eyebrow i{width:8px; height:8px; border-radius:50%; background:var(--teal); box-shadow:0 0 0 0 var(--teal); animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(94,159,31,.5)}70%{box-shadow:0 0 0 9px rgba(94,159,31,0)}100%{box-shadow:0 0 0 0 rgba(94,159,31,0)}}
.hero h1{font-size:clamp(36px,5.6vw,62px); font-weight:800; letter-spacing:.4px}
.hero h1 .hl{background:linear-gradient(90deg,var(--amber),var(--teal)); -webkit-background-clip:text; background-clip:text; color:transparent}
.hero p.lead{color:var(--muted); font-size:17px; max-width:46ch; margin:16px 0 24px}
.hero-cta{display:flex; gap:12px; flex-wrap:wrap}
.hero-stats{display:flex; gap:12px; margin-top:30px; flex-wrap:wrap}
.hero-stats .s{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 18px; box-shadow:var(--shadow-sm); min-width:112px}
.hero-stats .s b{font-family:var(--disp); font-size:26px; display:block; color:var(--amber); line-height:1.1}
.hero-stats .s span{font-size:11px; color:var(--muted); letter-spacing:.8px; font-weight:600}
.hero-visual{position:relative; border-radius:26px; overflow:hidden; border:1px solid var(--line);
  background:radial-gradient(120% 100% at 80% 0%, var(--glow2), transparent 55%), radial-gradient(100% 100% at 0% 100%, var(--glow1), transparent 60%), var(--card);
  box-shadow:var(--shadow); padding:28px 22px 22px; display:flex; flex-direction:column; align-items:center; gap:18px}
.hero-visual::before{content:""; position:absolute; width:260px; height:260px; border-radius:50%; right:-80px; top:-80px;
  background:linear-gradient(135deg,var(--amber),var(--teal)); opacity:.14; filter:blur(6px)}
.scene{position:relative; width:100%; height:130px; overflow:hidden}
.scene .road{position:absolute; left:0; right:0; bottom:12px; height:5px; border-radius:4px;
  background:repeating-linear-gradient(90deg,var(--muted-2) 0 30px,transparent 30px 58px); opacity:.55; animation:road 1.4s linear infinite}
@keyframes road{to{background-position:-58px 0}}
.scene .bigcar{position:absolute; left:50%; bottom:14px; width:230px; margin-left:-115px; animation:bob 2.4s ease-in-out infinite;
  filter:drop-shadow(0 12px 14px rgba(11,40,90,.25))}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.float-badge{position:absolute; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:8px 12px;
  font-size:12px; font-weight:600; box-shadow:var(--shadow-sm); display:flex; gap:7px; align-items:center; animation:floaty 5s ease-in-out infinite}
.float-badge.a{top:16px; left:14px}
.float-badge.b{top:18px; right:14px; animation-delay:1.2s}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.hero-visual .tagline{font-family:var(--disp); font-weight:600; letter-spacing:.5px; color:var(--muted); font-size:15px; text-align:center}

/* ---------- Sections ---------- */
.section{padding:30px 0}
.section-head{display:flex; align-items:end; justify-content:space-between; gap:14px; margin-bottom:20px; flex-wrap:wrap}
.section-head h2{font-size:32px}
.section-head .sub{color:var(--muted); font-size:14px; margin-top:4px}
.kicker{font-family:var(--disp); font-size:12px; letter-spacing:2.4px; color:var(--teal-d); font-weight:700; margin-bottom:6px; text-transform:uppercase}
[data-theme="dark"] .kicker{color:var(--teal)}

/* features */
.features{display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:14px}
.feat{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:18px; box-shadow:var(--shadow-sm); transition:transform .15s, border-color .15s}
.feat:hover{transform:translateY(-3px); border-color:var(--amber)}
.feat .ic{width:44px; height:44px; border-radius:13px; display:grid; place-items:center; font-size:21px; margin-bottom:12px;
  background:linear-gradient(135deg,var(--bg-info),var(--bg-ok))}
.feat h4{font-size:18px; margin-bottom:4px}
.feat p{font-size:13.5px; color:var(--muted)}

/* steps */
.steps{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:16px; counter-reset:s}
.step{position:relative; background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:22px 20px 20px; box-shadow:var(--shadow-sm)}
.step::before{counter-increment:s; content:counter(s); position:absolute; top:-16px; left:18px; width:34px; height:34px; border-radius:50%;
  background:linear-gradient(135deg,var(--amber),var(--teal)); color:#fff; font-family:var(--disp); font-weight:800; font-size:18px; display:grid; place-items:center; box-shadow:var(--shadow-sm)}
.step h4{font-size:18px; margin:6px 0 4px}
.step p{font-size:13.5px; color:var(--muted)}

/* ---------- Fleet ---------- */
.filters{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px}
.fchip{border:1px solid var(--line); background:var(--card); color:var(--muted); font-family:var(--body); font-weight:600; font-size:13px;
  padding:7px 14px; border-radius:999px; cursor:pointer; transition:.15s}
.fchip:hover{border-color:var(--amber); color:var(--text)}
.fchip.active{background:linear-gradient(135deg,var(--amber),var(--amber-d)); color:var(--on-amber); border-color:transparent}
.fleet-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(256px,1fr)); gap:20px}
.car{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; display:flex; flex-direction:column;
  box-shadow:var(--shadow-sm); transition:border-color .15s, transform .15s, box-shadow .15s}
.car:hover{border-color:var(--amber); transform:translateY(-4px); box-shadow:var(--shadow)}
.car-media{aspect-ratio:16/10; position:relative; display:grid; place-items:center; overflow:hidden; background:var(--media-bg)}
.car-media .car-photo{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:1; transition:transform .5s ease}
.car:hover .car-media .car-photo{transform:scale(1.05)}
.car-media .cat,.car-media .avail{z-index:2}
.car-media .glyph{width:84%; opacity:.95}
.car-media .cat{position:absolute; top:10px; left:10px; font-size:11px; font-weight:600; letter-spacing:.5px;
  background:rgba(255,255,255,.92); color:#27405f; border:1px solid rgba(0,0,0,.06); padding:4px 10px; border-radius:999px; backdrop-filter:blur(6px)}
.car-media .avail{position:absolute; top:10px; right:10px; font-size:11px; padding:4px 10px; border-radius:999px; font-weight:700; backdrop-filter:blur(6px)}
.avail.on{background:rgba(255,255,255,.92); color:#157A43; border:1px solid #BFE6CF}
.avail.off{background:rgba(255,255,255,.92); color:#B73535; border:1px solid #F2C4C4}
.car-body{padding:15px; display:flex; flex-direction:column; gap:10px; flex:1}
.car-title{font-family:var(--disp); font-size:20px; font-weight:700}
.car-specs{display:flex; flex-wrap:wrap; gap:6px}
.spec{font-size:11.5px; color:var(--muted); background:var(--card-2); border:1px solid var(--line-soft); padding:3px 9px; border-radius:8px}
.price-row{display:flex; align-items:baseline; gap:6px; margin-top:auto}
.price{font-family:var(--disp); font-size:25px; font-weight:800; color:var(--amber)}
.price small{font-size:12px; color:var(--muted); font-weight:500}
.car-actions{display:flex; gap:8px}

/* CTA */
.cta{border-radius:24px; padding:34px 30px; color:#fff; position:relative; overflow:hidden;
  background:linear-gradient(120deg,var(--cta-from),var(--cta-to)); box-shadow:var(--shadow);
  display:flex; justify-content:space-between; gap:22px; flex-wrap:wrap; align-items:center}
.cta::after{content:""; position:absolute; right:-60px; bottom:-90px; width:300px; height:300px; border-radius:50%;
  background:radial-gradient(circle,rgba(139,209,63,.55),transparent 65%)}
.cta h2{font-size:30px; position:relative; z-index:1}
.cta p{opacity:.9; margin-top:6px; max-width:50ch; position:relative; z-index:1}
.cta .acts{display:flex; gap:10px; flex-wrap:wrap; position:relative; z-index:1}
.cta .btn-white{background:#fff; color:#0B4FA8; border-color:#fff}
.cta .btn-line{background:transparent; color:#fff; border-color:rgba(255,255,255,.55)}

/* ---------- Forms ---------- */
.field{margin-bottom:14px}
.field label{display:block; font-size:13px; color:var(--muted); margin-bottom:6px; font-weight:500}
.input,select,textarea{width:100%; font-family:var(--body); font-size:14.5px; color:var(--text);
  background:var(--input); border:1px solid var(--line); border-radius:11px; padding:11px 13px; outline:none; transition:border-color .15s, box-shadow .15s}
.input:focus,select:focus,textarea:focus{border-color:var(--amber); box-shadow:0 0 0 3px var(--bg-info)}
.input:disabled{opacity:.75}
textarea{resize:vertical; min-height:78px}
select{appearance:none; background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 18px) 18px,calc(100% - 13px) 18px; background-size:5px 5px,5px 5px; background-repeat:no-repeat}
.grid-2{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.form-err{color:var(--t-err); font-size:13px; margin:2px 0 10px}

/* ---------- Cards / panels ---------- */
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:22px; box-shadow:var(--shadow-sm)}
.auth-wrap{max-width:430px; margin:40px auto; padding:0 16px}
.auth-tabs{display:flex; gap:6px; background:var(--input); border:1px solid var(--line); border-radius:12px; padding:5px; margin-bottom:20px}
.auth-tabs button{flex:1; background:transparent; border:none; color:var(--muted); font-family:var(--body);
  font-weight:600; font-size:14px; padding:9px; border-radius:8px; cursor:pointer}
.auth-tabs button.active{background:var(--card); color:var(--text); box-shadow:var(--shadow-sm)}

/* ---------- Dashboard ---------- */
.dash-head{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin:26px 0 18px}
.dash-head h2{font-size:30px}
.tabs{display:flex; gap:6px; flex-wrap:wrap; border-bottom:1px solid var(--line); margin-bottom:22px; overflow-x:auto}
.tab{background:transparent; border:none; border-bottom:3px solid transparent; color:var(--muted);
  font-family:var(--body); font-weight:600; font-size:14px; padding:11px 14px; cursor:pointer; white-space:nowrap}
.tab.active{color:var(--amber); border-bottom-color:var(--amber)}
.stat-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:14px; margin-bottom:22px}
.stat{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px 18px; box-shadow:var(--shadow-sm)}
.stat .n{font-family:var(--disp); font-size:30px; font-weight:800}
.stat .l{font-size:12px; color:var(--muted); letter-spacing:.5px; margin-top:2px; font-weight:600}
.stat.amber .n{color:var(--amber)} .stat.teal .n{color:var(--teal)} .stat.green .n{color:var(--green)}

/* ---------- Table ---------- */
.tbl-scroll{overflow-x:auto; border:1px solid var(--line); border-radius:14px; background:var(--card); box-shadow:var(--shadow-sm)}
table.tbl{width:100%; border-collapse:collapse; font-size:13.5px; min-width:560px}
.tbl th{text-align:left; font-family:var(--disp); font-weight:600; letter-spacing:.5px; color:var(--muted);
  font-size:12px; text-transform:uppercase; padding:12px 14px; border-bottom:1px solid var(--line); background:var(--card-2)}
.tbl td{padding:12px 14px; border-bottom:1px solid var(--line-soft); vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:var(--card-2)}
.pill{font-size:11.5px; font-weight:700; padding:3px 10px; border-radius:999px; display:inline-block}
.pill.pending{background:var(--bg-warn); color:var(--t-warn); border:1px solid var(--b-warn)}
.pill.confirmed{background:var(--bg-info); color:var(--t-info); border:1px solid var(--b-info)}
.pill.completed{background:var(--bg-ok); color:var(--t-ok); border:1px solid var(--b-ok)}
.pill.cancelled{background:var(--bg-err); color:var(--t-err); border:1px solid var(--b-err)}
.pill.admin{background:var(--bg-info); color:var(--t-info); border:1px solid var(--b-info)}
.pill.user{background:var(--card-2); color:var(--muted); border:1px solid var(--line)}
.row-actions{display:flex; gap:6px; flex-wrap:wrap}

/* ---------- Modal ---------- */
.modal-back{position:fixed; inset:0; background:rgba(10,24,46,.55); backdrop-filter:blur(5px);
  z-index:60; display:grid; place-items:center; padding:16px; overflow-y:auto}
.modal{background:var(--card); border:1px solid var(--line); border-radius:18px; width:100%;
  max-width:520px; box-shadow:var(--shadow); max-height:92vh; overflow-y:auto; animation:pop .18s ease}
@keyframes pop{from{transform:scale(.97); opacity:0}to{transform:none; opacity:1}}

<script>
/* ============================================================
   OK MOBILITY CAR RENTALS & HIRE  —  client-side portal
   Data is stored in Firebase (Firestore + Auth), shared across devices.
   ============================================================ */

/* ---------- THEME (light / dark) ---------- */
function currentTheme(){ return document.documentElement.getAttribute('data-theme')==='dark' ? 'dark' : 'light'; }
function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  const m=document.getElementById('metaTheme'); if(m) m.setAttribute('content', t==='dark' ? '#0B1626' : '#FFFFFF');

/* ---------- LOGO ----------

    <text x="165" y="156" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-weight="600" font-size="14.5" fill="#6AA529" textLength="270" lengthAdjust="spacingAndGlyphs">— Cars Rental And Beyond —</text>
  </svg>`;
}
function logoImg(size){
  return `<span class="logo-chip ${size||''}"><img src="logo.png" alt="OK Mobility — Cars Rental And Beyond" onerror="this.outerHTML=logoSVG()"></span>`;
}

/* ============================================================
   DATA LAYER — Firebase (Firestore + Auth)
   ============================================================ */
const auth = FB_OK ? firebase.auth() : null;
const fdb  = FB_OK ? firebase.firestore() : null;

const STATE = { user:null, cars:[], bookings:[], users:[], settings:null, ready:false };
const K = { cars:'cars', bookings:'bookings', users:'users', settings:'settings' };
const DB = {
  get(k, def){
    if(k===K.cars) return STATE.cars;
    if(k===K.bookings) return STATE.bookings;
    if(k===K.users) return STATE.users;
    if(k===K.settings) return STATE.settings || def || null;
    return def;
  },
  set(){}
};

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KES = n => 'KES ' + Number(n||0).toLocaleString('en-KE');
const todayISO = () => new Date().toISOString().slice(0,10);
function toast(msg, type){ const t=$('#toast'); t.textContent=msg; t.className='show '+(type||''); setTimeout(()=>t.className='',2600); }
function authMsg(e){ const m={'auth/invalid-email':'That email looks invalid.','auth/user-not-found':'No account with that email.','auth/wrong-password':'Incorrect password.','auth/invalid-credential':'Incorrect email or password.','auth/email-already-in-use':'That email is already registered.','auth/weak-password':'Password must be at least 6 characters.','auth/too-many-requests':'Too many attempts. Try again later.','auth/network-request-failed':'Network error. Check your connection.'}; return m[e&&e.code] || (e&&e.message) || 'Something went wrong.'; }

/* ---------- settings ---------- */
const DEFAULT_SETTINGS = { name:'OK Mobility', tagline:'CARS RENTAL AND BEYOND',
  phone:'0726049772', whatsapp:'254726049772', location:'Kenya', email:'' };
function settings(){ return STATE.settings || DEFAULT_SETTINGS; }

/* ---------- free stock photos (Unsplash License) ---------- */
const uImg = id => `https://images.unsplash.com/photo-${id}?w=800&h=520&fit=crop&q=70&auto=format`;
const STOCK = {
  'Toyota Vitz':'1604430096113-f3806ab7c810',
  'Toyota Axio':'1573710459621-bb101783ca0f',
  'Toyota Fielder':'1766918070462-20206f5610f6',
  'Toyota Noah':'1675311183084-755007dbb223',
  'Nissan X-Trail':'1533473359331-0135ef1b58bf',
  'Toyota Harrier':'1622893288761-823ba60f17a6',
  'Mazda CX-5':'1531181616225-f8e50c1ab53e',
  'Subaru Forester':'1606611013016-969c19ba27bb',
  'Toyota Prado':'1506015391300-4802dc74de2e',
  'Toyota Land Cruiser V8':'1612563893490-d86ed296e5e6',
  'Toyota Hilux Double Cab':'1612057473166-af2affdb92ad',
  'Toyota Hiace 14-Seater':'1521499420147-36d5bfc2781f',
};
function stockFor(name){ return STOCK[name] ? uImg(STOCK[name]) : ''; }

/* ---------- starter fleet ---------- */
const SEED_CARS = [
  ['Toyota Vitz','Hatchback',2800,'Automatic','Petrol',5,'Compact, fuel-saving hatchback — perfect for city runs.'],
  ['Toyota Axio','Sedan',3500,'Automatic','Petrol',5,'Comfortable, economical sedan for daily hire.'],
  ['Toyota Fielder','Wagon',4000,'Automatic','Petrol',5,'Roomy station wagon with a big boot for luggage.'],

  ['Toyota Harrier','SUV',9000,'Automatic','Petrol',5,'Premium SUV — stylish, smooth and spacious.'],

];
async function seedIfEmpty(){
  if(!STATE.user || STATE.user.role!=='admin') return;
  try{
    const snap = await fdb.collection('cars').limit(1).get();
    if(!snap.empty) return;
    const batch = fdb.batch();
    SEED_CARS.forEach(c=>{ const ref=fdb.collection('cars').doc();
      batch.set(ref, { name:c[0], category:c[1], price:c[2], transmission:c[3], fuel:c[4],
        seats:c[5], desc:c[6], image:stockFor(c[0]), available:true, createdAt:Date.now() }); });
    batch.set(fdb.collection('settings').doc('app'), DEFAULT_SETTINGS, { merge:true });
    await batch.commit(); toast('Starter fleet loaded','ok');
  }catch(e){ console.warn('seed skipped', e); }
}

/* ---------- realtime listeners -> STATE ---------- */
const _unsub = {};
function detachAll(){ Object.keys(_unsub).forEach(k=>{ try{ _unsub[k] && _unsub[k](); }catch(e){} delete _unsub[k]; }); }
function attachListeners(){
  detachAll();
  _unsub.settings = fdb.collection('settings').doc('app').onSnapshot(
    d => { STATE.settings = d.exists ? d.data() : DEFAULT_SETTINGS; render(); },
    e => { STATE.settings = STATE.settings || DEFAULT_SETTINGS; });
  _unsub.cars = fdb.collection('cars').onSnapshot(
    s => { STATE.cars = s.docs.map(d=>({ id:d.id, ...d.data() })).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0)); render(); },
    e => console.warn('cars listen', e));
  const u = STATE.user;
  if(u && u.role==='admin'){
    _unsub.bookings = fdb.collection('bookings').onSnapshot(
      s => { STATE.bookings = s.docs.map(d=>({ id:d.id, ...d.data() })); render(); }, e=>console.warn('bookings', e));
    _unsub.users = fdb.collection('users').onSnapshot(
      s => { STATE.users = s.docs.map(d=>({ id:d.id, ...d.data() })); render(); }, e=>console.warn('users', e));
  } else if(u){
    _unsub.bookings = fdb.collection('bookings').where('userId','==',u.uid).onSnapshot(
      s => { STATE.bookings = s.docs.map(d=>({ id:d.id, ...d.data() })); render(); }, e=>console.warn('own bookings', e));
    STATE.users = [];
  } else { STATE.bookings = []; STATE.users = []; }
}

/* ---------- session / auth state ---------- */
function currentUser(){ return STATE.user; }
function logout(){ auth.signOut().then(()=>{ toast('Signed out'); go('home'); }); }

/* If Firebase could not load (blocked network / preview sandbox), show the design with the sample fleet */
function offlinePreview(){
  STATE.cars = SEED_CARS.map((c,i)=>({ id:'demo'+i, name:c[0], category:c[1], price:c[2], transmission:c[3], fuel:c[4],
    seats:c[5], desc:c[6], image:stockFor(c[0]), available:true, createdAt:i }));
  STATE.settings = DEFAULT_SETTINGS; STATE.ready = true;
  const n=document.createElement('div');
  n.style.cssText='position:fixed;left:12px;right:12px;bottom:12px;z-index:80;max-width:560px;margin:0 auto;background:#FFF4D6;color:#6b4a00;border:1px solid #F1DDA3;border-radius:12px;padding:10px 14px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.18)';
  n.innerHTML='<b>Preview mode:</b> Firebase could not load, so sample cars are shown and sign-in / booking are off. Open the published site with internet access for the live version. <a href="#" onclick="this.parentNode.remove();return false" style="color:#6b4a00;font-weight:700">Dismiss</a>';
  document.body.appendChild(n);
  render();
}
if(!FB_OK){ offlinePreview(); }
else auth.onAuthStateChanged(async (fbUser) => {
  detachAll();
  if(fbUser){
    let role='user', username = fbUser.displayName || (fbUser.email||'').split('@')[0];
    try{
      const uref = fdb.collection('users').doc(fbUser.uid);
      const snap = await uref.get();
      if(snap.exists){ const d=snap.data(); role=d.role||'user'; username=d.username||username; }
      else { await uref.set({ username, email:fbUser.email, role:'user', createdAt:Date.now() }); }
    }catch(e){ console.warn('profile', e); }
    STATE.user = { uid:fbUser.uid, email:fbUser.email, username, role };
    attachListeners(); seedIfEmpty();
  } else {
    STATE.user = null; attachListeners();
  }
  STATE.ready = true; render();
});

}

      +G("M86,49 L104,49 L104,61 L74,61 Z")+G("M110,49 L128,49 L138,61 L110,61 Z")+head(188,72);

      +G("M60,47 L84,47 L84,58 L60,58 Z")+G("M90,47 L104,47 L112,58 L90,58 Z")

function carGlyph(cat){ return vehicleSVG(bodyTypeFor(cat), tintFor(cat)); }
function carMedia(car){
  const glyph = carGlyph(car.category);
  if(car.image) return `${glyph}<img class="car-photo" src="${esc(car.image)}" alt="${esc(car.name)}" loading="lazy" decoding="async" onerror="this.remove()">`;

/* ============================================================
   ROUTER
   ============================================================ */
let VIEW = 'home';
let ADMIN_TAB = 'fleet';
let FLEET_CAT = 'All';
function go(v){ VIEW=v; window.scrollTo({top:0,behavior:'instant'}); render(); }

function render(){
  const s = settings();
  if(!$('#brandLogo').firstChild){
    $('#brandLogo').innerHTML = logoImg('') + `<span class="btag">CARS RENTAL<br>AND BEYOND</span>`;
    $('#footLogo').innerHTML = logoImg('md');

  $('#footName').textContent = s.name;
  $('#phoneChip').textContent = '📞 '+s.phone;
  $('#footPhone').textContent = s.phone;
  $('#footPhone').href = 'tel:'+s.phone;
  $('#yr').textContent = new Date().getFullYear();
  renderNavAuth();

  const u = currentUser();
  let html='';

async function doLogin(){
  const email=$('#liUser').value.trim(); const pw=$('#liPass').value; const err=$('#liErr');
  if(!email||!pw){ err.textContent='Enter your email and password.'; return; }
  err.textContent='Signing in…';
  try{ await auth.signInWithEmailAndPassword(email, pw); toast('Signed in','ok'); go('account'); }
  catch(e){ err.textContent=authMsg(e); }
}
async function doRegister(){
  const un=$('#rgUser').value.trim(); const em=$('#rgEmail').value.trim();
  const pw=$('#rgPass').value; const cf=$('#rgConf').value; const err=$('#rgErr');
  if(!un||!em||!pw){ err.textContent='Fill in all fields.'; return; }
  if(pw.length<6){ err.textContent='Password must be at least 6 characters.'; return; }
  if(pw!==cf){ err.textContent='Passwords do not match.'; return; }
  err.textContent='Creating account…';
  try{
    const cred = await auth.createUserWithEmailAndPassword(em, pw);
    try{ await cred.user.updateProfile({ displayName:un }); }catch(e){}
    try{ await fdb.collection('users').doc(cred.user.uid).set({ username:un, email:em, role:'user', createdAt:Date.now() }); }catch(e){ console.warn(e); }
    toast('Account created. Welcome!','ok'); go('account');
  }catch(e){ err.textContent=authMsg(e); }
}
async function changePassword(){
  const err=$('#cpErr');
  const oldp=$('#cpOld').value, np=$('#cpNew').value, cf=$('#cpConf').value;
  if(!oldp||!np){ err.textContent='Fill in all fields.'; return; }
  if(np.length<6){ err.textContent='New password must be at least 6 characters.'; return; }
  if(np!==cf){ err.textContent='New passwords do not match.'; return; }
  const user=auth.currentUser; if(!user){ err.textContent='Please sign in again.'; return; }
  err.textContent='Updating…';
  try{
    const cred = firebase.auth.EmailAuthProvider.credential(user.email, oldp);
    await user.reauthenticateWithCredential(cred);
    await user.updatePassword(np);
    toast('Password updated','ok'); go('account');
  }catch(e){ err.textContent = (e&&e.code==='auth/wrong-password') ? 'Current password is incorrect.' : authMsg(e); }
}
async function forgotPassword(){
  const email=$('#liUser').value.trim(); const err=$('#liErr');
  if(!email){ err.textContent='Type your email above first, then tap Forgot password.'; return; }
  try{ await auth.sendPasswordResetEmail(email); err.textContent=''; toast('Password reset email sent','ok'); }
  catch(e){ err.textContent=authMsg(e); }
}

    </div>

    <div class="card" style="padding:12px 14px;background:var(--input);box-shadow:none;display:flex;justify-content:space-between;align-items:center">
      <span class="muted small">Estimated total</span>
      <strong id="bkTotal" style="font-family:var(--disp);font-size:22px;color:var(--amber)">${KES(car.price)}</strong>
    </div>
    <div class="form-err" id="bkErr"></div>
    <button class="btn btn-amber btn-block" style="margin-top:14px" onclick="submitBooking('${car.id}')">Confirm booking</button>
    <button class="btn btn-ghost btn-block" style="margin-top:8px" onclick="bookViaWhatsApp('${car.id}')">💬 Send booking via WhatsApp</button>`;
  showModal('Book '+car.name, body);
  const recalc=()=>{
    const d=days($('#bkStart').value,$('#bkEnd').value);
    $('#bkTotal').textContent=KES(car.price*d)+ (d>1?`  ·  ${d} days`:'');
  };
  $('#bkStart').onchange=recalc; $('#bkEnd').onchange=recalc;
}
function days(a,b){ if(!a||!b) return 1; const d=Math.ceil((new Date(b)-new Date(a))/86400000); return Math.max(1,d||1); }
function collectBooking(carId){
  const car=DB.get(K.cars,[]).find(c=>c.id===carId);
  const name=$('#bkName').value.trim(), phone=$('#bkPhone').value.trim();
  const email=$('#bkEmail').value.trim(), idno=$('#bkId').value.trim();
  const start=$('#bkStart').value, end=$('#bkEnd').value, notes=$('#bkNotes').value.trim();
  if(!name||!phone||!start||!end){ $('#bkErr').textContent='Name, phone, pick-up and return dates are required.'; return null; }
  if(new Date(end)<new Date(start)){ $('#bkErr').textContent='Return date cannot be before pick-up date.'; return null; }
  const d=days(start,end); const u=currentUser();
  return { carId, carName:car.name, price:car.price, days:d, total:car.price*d,
    name, phone, email, idno, start, end, notes, status:'pending',
    userId:u?u.uid:null, createdAt:Date.now() };
}
async function saveBookingDoc(b){ return fdb.collection('bookings').add(b); }
async function submitBooking(carId){
  const b=collectBooking(carId); if(!b) return;
  $('#bkErr').textContent='Sending…';
  try{ await saveBookingDoc(b); closeModal(); toast('Booking request sent! We will confirm shortly.','ok');
       if(currentUser()) go('account'); }
  catch(e){ $('#bkErr').textContent='Could not send booking: '+(e&&e.message||'error'); }
}
async function bookViaWhatsApp(carId){
  const b=collectBooking(carId); if(!b) return;
  try{ await saveBookingDoc(b); }catch(e){ console.warn(e); }
  const s=settings();
  const msg=`New car hire request — ${s.name}%0A%0ACar: ${b.carName}%0AName: ${b.name}%0APhone: ${b.phone}%0AEmail: ${b.email||'-'}%0AID: ${b.idno||'-'}%0APick-up: ${b.start}%0AReturn: ${b.end} (${b.days} day/s)%0AEstimated total: ${KES(b.total)}%0ANotes: ${b.notes||'-'}`;
  window.open(`https://wa.me/${s.whatsapp}?text=${msg}`,'_blank');
  closeModal(); toast('Opening WhatsApp…','ok');
  if(currentUser()) go('account');
}

let CAR_IMG = null;
function setImgPreview(src){
  const p=$('#imgPrev'); if(!p) return;
  p.innerHTML = src ? `<img src="${esc(src)}" style="width:100%;height:100%;object-fit:cover" onerror="this.parentNode.innerHTML='<span class=\\'tiny muted\\'>Bad image</span>'">`
                    : `<span class="tiny muted">No photo</span>`;
}
function resizeImage(file, maxW, cb){
  const reader=new FileReader();
  reader.onload=()=>{ const img=new Image();
    img.onload=()=>{ let w=img.width, h=img.height;
      if(w>maxW){ h=Math.round(h*maxW/w); w=maxW; }
      const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      cb(cv.toDataURL('image/jpeg',0.72));
    };
    img.onerror=()=>toast('Could not read that image','err');
    img.src=reader.result; };
  reader.readAsDataURL(file);
}
function handleCarImg(input){
  const f=input.files&&input.files[0]; if(!f) return;
  if(!f.type.startsWith('image/')){ toast('Please choose an image file','err'); return; }
  resizeImage(f, 900, d=>{ CAR_IMG=d; setImgPreview(d); toast('Photo added','ok'); });

  const body=`

          ${CAR_IMG?`<img src="${esc(CAR_IMG)}" style="width:100%;height:100%;object-fit:cover">`:'<span class="tiny muted">No photo</span>'}
        </div>
        <div style="flex:1;min-width:180px">
          <input type="file" id="fFile" accept="image/*" style="display:none" onchange="handleCarImg(this)">
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <button type="button" class="btn btn-sm btn-ghost" onclick="document.getElementById('fFile').click()">📷 Upload photo</button>

      <input class="input" id="fImg" value="${isUrl?esc(CAR_IMG):''}" placeholder="https://… (leave blank if you uploaded a photo)" oninput="onImgUrl(this.value)"></div>
    <div class="field"><label>Description (optional)</label><textarea id="fDesc">${c?esc(c.desc):''}</textarea></div>
    <div class="form-err" id="fErr"></div>
    <button class="btn btn-amber btn-block" onclick="saveCar('${id||''}')">${c?'Save changes':'Add car'}</button>`;

async function saveCar(id){
  const name=$('#fName').value.trim(); const price=parseFloat($('#fPrice').value);
  if(!name){ $('#fErr').textContent='Car name is required.'; return; }
  if(isNaN(price)||price<0){ $('#fErr').textContent='Enter a valid price.'; return; }
  const data={ name, category:$('#fCat').value, price, seats:parseInt($('#fSeats').value)||5,
    transmission:$('#fTrans').value, fuel:$('#fFuel').value, image:CAR_IMG||'', desc:$('#fDesc').value.trim() };
  $('#fErr').textContent='Saving…';
  try{
    if(id){ await fdb.collection('cars').doc(id).update(data); }
    else { await fdb.collection('cars').add({ available:true, createdAt:Date.now(), ...data }); }
    closeModal(); toast(id?'Car updated':'Car added','ok');
  }catch(e){ $('#fErr').textContent='Could not save: '+(e&&e.message||'error'); }
}
async function toggleCar(id){
  const c=DB.get(K.cars,[]).find(x=>x.id===id); if(!c) return;
  try{ await fdb.collection('cars').doc(id).update({ available:!c.available }); }catch(e){ toast('Update failed','err'); }
}
function deleteCar(id){
  const c=DB.get(K.cars,[]).find(x=>x.id===id);
  confirmModal('Delete car?', `Remove <b>${esc(c.name)}</b> from the fleet? This cannot be undone.`, async ()=>{
    closeModal();
    try{ await fdb.collection('cars').doc(id).delete(); toast('Car deleted','ok'); }catch(e){ toast('Delete failed','err'); }
  });
}

function waNum(phone){
  let n=String(phone||'').replace(/[^0-9]/g,'');
  if(n.startsWith('0')) n='254'+n.slice(1);
  else if(n.startsWith('7')||n.startsWith('1')) n='254'+n;
  return n;
}
function bookingUpdateMsg(b,st,s){
  const biz=s.name||'OK Mobility';
  const contact=s.phone||s.whatsapp||'';
  const car=b.carName||'your car';
  if(st==='confirmed')
    return `Hello ${b.name}, your booking with ${biz} is CONFIRMED \u2705\n\nCar: ${car}\nPick-up: ${b.start}\nReturn: ${b.end} (${b.days} day/s)\nTotal: ${KES(b.total)}\n\nThank you for choosing us. For anything, call or WhatsApp ${contact}.`;
  if(st==='completed')
    return `Hello ${b.name}, your hire with ${biz} is now marked COMPLETE \uD83D\uDE97\n\nCar: ${car}\nPeriod: ${b.start} \u2192 ${b.end}\n\nThank you for your business \u2014 we hope to serve you again!`;
  if(st==='cancelled')
    return `Hello ${b.name}, we're sorry to let you know your booking with ${biz} has been CANCELLED.\n\nCar: ${car}\nDates: ${b.start} \u2192 ${b.end}\n\nPlease contact us on ${contact} with any questions.`;
  return '';
}
function openWa(){ if(window.__waURL) window.open(window.__waURL,'_blank'); closeModal(); }
async function setBookingStatus(id,st){
  const b=DB.get(K.bookings,[]).find(x=>x.id===id);
  try{ await fdb.collection('bookings').doc(id).update({ status:st }); toast('Marked '+st,'ok'); }
  catch(e){ toast('Update failed','err'); return; }
  if(b && b.phone && ['confirmed','completed','cancelled'].includes(st)){
    const s=settings();
    const msg=bookingUpdateMsg(b,st,s);
    window.__waURL='https://wa.me/'+waNum(b.phone)+'?text='+encodeURIComponent(msg);
    showModal('Notify '+esc(b.name)+'?', `
      <p class="muted small" style="margin-bottom:12px">Status saved as <b>${esc(st)}</b>. Send the customer a WhatsApp update? WhatsApp opens with this message ready \u2014 you tap send.</p>
      <div style="white-space:pre-wrap;background:var(--input);border:1px solid var(--line-soft);border-radius:10px;padding:12px;font-size:13px;line-height:1.5;margin-bottom:16px">${esc(msg)}</div>
      <div style="display:flex;gap:10px;justify-content:flex-end">
        <button class="btn btn-ghost" onclick="closeModal()">Skip</button>
        <button class="btn btn-teal" onclick="openWa()">\uD83D\uDCAC Open WhatsApp</button>
      </div>`);
  }
}
function viewBooking(id){
  const b=DB.get(K.bookings,[]).find(x=>x.id===id);
  const row=(k,v)=>`<div style="display:flex;justify-content:space-between;gap:16px;padding:9px 0;border-bottom:1px solid var(--line-soft)"><span class="muted small">${k}</span><span style="text-align:right">${v||'—'}</span></div>`;
  showModal('Booking details', `
    ${row('Customer', esc(b.name))}
    ${row('Phone', `<a href="tel:${esc(b.phone)}">${esc(b.phone)}</a>`)}
    ${row('Email', esc(b.email))}
    ${row('ID / Passport', esc(b.idno))}
    ${row('Car', esc(b.carName))}
    ${row('Pick-up', esc(b.start))}
    ${row('Return', esc(b.end))}
    ${row('Days', b.days)}
    ${row('Price/day', KES(b.price))}
    ${row('Total', `<b style="color:var(--amber)">${KES(b.total)}</b>`)}

function deleteBooking(id){
  confirmModal('Delete booking?','This will permanently remove the booking record.',async ()=>{
    closeModal();
    try{ await fdb.collection('bookings').doc(id).delete(); toast('Booking deleted','ok'); }catch(e){ toast('Delete failed','err'); }
  });

function exportBookingsCSV(){
  const list=DB.get(K.bookings,[]);
  if(!list.length){ toast('No bookings to export','err'); return; }
  const head=['Name','Phone','Email','ID','Car','PickUp','Return','Days','PricePerDay','Total','Status','Requested'];
  const rows=list.map(b=>[b.name,b.phone,b.email,b.idno,b.carName,b.start,b.end,b.days,b.price,b.total,b.status,b.createdAt]
    .map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(','));
  const csv=[head.join(','),...rows].join('\n');
  const blob=new Blob([csv],{type:'text/csv'}); const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download='okmobility-bookings-'+todayISO()+'.csv'; a.click();
  URL.revokeObjectURL(url); toast('CSV downloaded','ok');
}

/* ----- Customers ----- */
function adminCustomers(){
  const list=DB.get(K.bookings,[]);
  const map={};
  list.forEach(b=>{ const key=b.phone||b.email||b.name;
    if(!map[key]) map[key]={ name:b.name, phone:b.phone, email:b.email, idno:b.idno, count:0, spent:0, last:b.createdAt };
    map[key].count++; map[key].spent += ['confirmed','completed'].includes(b.status)?b.total:0;
    if(b.createdAt>map[key].last) map[key].last=b.createdAt;
  });
  const custs=Object.values(map).sort((a,b)=>b.count-a.count);
  const rows=custs.map(c=>`
    <tr><td><b>${esc(c.name)}</b>${c.idno?`<div class="tiny muted">ID ${esc(c.idno)}</div>`:''}</td>
      <td><a href="tel:${esc(c.phone)}">${esc(c.phone)}</a><div class="tiny muted">${esc(c.email||'')}</div></td>
      <td class="mono">${c.count}</td>
      <td class="mono">${KES(c.spent)}</td>
      <td class="tiny muted">${new Date(c.last).toLocaleDateString('en-KE')}</td>
    </tr>`).join('') || `<tr><td colspan="5" class="muted center" style="padding:24px">No customer data yet.</td></tr>`;
  return `<div class="section-head"><div><h3 style="font-size:22px">Customers</h3>
      <div class="sub">Everyone who has requested a hire, with totals.</div></div>
      <div class="chip">${custs.length} customers</div></div>
    <div class="tbl-scroll"><table class="tbl">
      <thead><tr><th>Customer</th><th>Contact</th><th>Bookings</th><th>Spent</th><th>Last</th></tr></thead>
      <tbody>${rows}</tbody></table></div>`;
}

/* ----- Reports ----- */
function adminReports(){
  const cars=DB.get(K.cars,[]); const bk=DB.get(K.bookings,[]);
  const earned=bk.filter(b=>['confirmed','completed'].includes(b.status)).reduce((s,b)=>s+b.total,0);
  const pending=bk.filter(b=>b.status==='pending').length;
  const thisMonth=bk.filter(b=>new Date(b.createdAt).toISOString().slice(0,7)===new Date().toISOString().slice(0,7)).length;
  const byCar={};
  bk.filter(b=>['confirmed','completed'].includes(b.status)).forEach(b=>{ byCar[b.carName]=(byCar[b.carName]||0)+b.total; });
  const maxRev=Math.max(1,...Object.values(byCar));
  const bars=Object.entries(byCar).sort((a,b)=>b[1]-a[1]).map(([n,v])=>`
    <div style="margin-bottom:12px">
      <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px"><span>${esc(n)}</span><span class="mono muted">${KES(v)}</span></div>
      <div style="height:9px;background:var(--input);border-radius:999px;overflow:hidden"><div style="height:100%;width:${(v/maxRev*100).toFixed(0)}%;background:linear-gradient(90deg,var(--amber),var(--teal))"></div></div>
    </div>`).join('') || `<div class="muted small">No confirmed revenue yet.</div>`;
  const statuses=['pending','confirmed','completed','cancelled'].map(s=>[s,bk.filter(b=>b.status===s).length]);
  return `
    <div class="stat-grid">
      <div class="stat green"><div class="n mono">${KES(earned).replace('KES ','')}</div><div class="l">KES CONFIRMED REVENUE</div></div>
      <div class="stat amber"><div class="n">${bk.length}</div><div class="l">TOTAL BOOKINGS</div></div>
      <div class="stat teal"><div class="n">${pending}</div><div class="l">PENDING REQUESTS</div></div>
      <div class="stat"><div class="n">${thisMonth}</div><div class="l">THIS MONTH</div></div>
      <div class="stat"><div class="n">${cars.filter(c=>c.available).length}/${cars.length}</div><div class="l">CARS AVAILABLE</div></div>
    </div>
    <div style="display:grid;grid-template-columns:1.3fr .7fr;gap:16px" class="rep-grid">
      <div class="card"><h3 style="font-size:18px;margin-bottom:16px">Revenue by car (confirmed)</h3>${bars}</div>
      <div class="card"><h3 style="font-size:18px;margin-bottom:16px">Bookings by status</h3>
        ${statuses.map(([s,n])=>`<div style="display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line-soft)">
          <span class="pill ${s}">${s}</span><b class="mono">${n}</b></div>`).join('')}
        <button class="btn btn-ghost btn-block" style="margin-top:16px" onclick="exportBookingsCSV()">⬇ Export bookings CSV</button>
      </div>
    </div>`;
}

async function toggleRole(id){
  const users=DB.get(K.users,[]); const u=users.find(x=>x.id===id); if(!u) return;
  if(u.role==='admin' && users.filter(x=>x.role==='admin').length<=1){ toast('Keep at least one admin','err'); return; }
  const next=u.role==='admin'?'user':'admin';
  try{ await fdb.collection('users').doc(id).update({ role:next }); toast('Role updated','ok'); }
  catch(e){ toast('Update failed','err'); }
}
async function sendReset(email){
  if(!email){ toast('No email on file','err'); return; }
  try{ await auth.sendPasswordResetEmail(email); toast('Reset email sent to '+email,'ok'); }
  catch(e){ toast(authMsg(e),'err'); }
}
function deleteUser(id){
  const u=DB.get(K.users,[]).find(x=>x.id===id);
  confirmModal('Remove user?',`Remove access for <b>${esc(u.username||u.email||'this user')}</b>? (Their sign-in account stays until you delete it in the Firebase console.)`,async ()=>{
    closeModal();
    try{ await fdb.collection('users').doc(id).delete(); toast('User removed','ok'); }catch(e){ toast('Delete failed','err'); }
  });
}

async function saveBiz(){

/* ============================================================
   MODALS
   ============================================================ */
function showModal(title, bodyHtml){
  $('#modalRoot').innerHTML=`<div class="modal-back" onclick="if(event.target===this)closeModal()">
    <div class="modal"><div class="modal-head"><h3>${title}</h3><button class="x" onclick="closeModal()">×</button></div>
    <div class="modal-body">${bodyHtml}</div></div></div>`;
}
function closeModal(){ $('#modalRoot').innerHTML=''; }
function confirmModal(title, msg, onYes){
  window.__yes=onYes;
  showModal(title, `<p style="margin-bottom:18px">${msg}</p>
    <div style="display:flex;gap:10px;justify-content:flex-end">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-danger" onclick="(window.__yes&&window.__yes());">Yes, continue</button>
    </div>`);
}

/* ============================================================
   BIND (post-render hooks) + BOOT
   ============================================================ */
function bindView(){}

let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',(e)=>{ e.preventDefault(); deferredPrompt=e;
  const bar=document.getElementById('installBar'); if(bar) bar.style.display='flex'; });
document.getElementById('installBtn').addEventListener('click',async()=>{
  document.getElementById('installBar').style.display='none';
  if(deferredPrompt){ deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt=null; }
});

(function boot(){
  render();
  if('serviceWorker' in navigator){
    window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
  }
})();
</script>
